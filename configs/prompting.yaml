language: sv

experiment:
  name: phase2_prompting

dtype: bfloat16

data:
  dir: data/processed/{lang}
  train_en: train_en.jsonl
  train_target: train_{lang}.jsonl
  dev:
    en: dev_en.jsonl
    target: dev_{lang}.jsonl
  test:
    en: test_en.jsonl
    target: test_{lang}.jsonl

models:
  - name: Qwen/Qwen2.5-3B-Instruct
    role: primary
  - name: utter-project/EuroLLM-9B-Instruct
    role: secondary

prompting:
  id_key: alignment_id

  # five aligned IDs shared by English and Swedish
  # run --select-ids to find valid aligned TRAIN IDs
  five_shot_ids:
    [
      "en/1990/100530/5989398.xml.gz#575",
      "en/1965/59309/6919338.xml.gz#1621",
      "en/1954/46754/6980377.xml.gz#1659",
      "en/2015/4428728/6758675.xml.gz#636",
      "en/1965/59309/6919338.xml.gz#1231",
    ]

  selection:
    k: 5
    seed: 42
    min_words: 5
    max_words: 20
    max_labels: 3
    min_single: 1

generation:
  max_new_tokens: 64
  batch_size: 8
  chat_template_kwargs: {}

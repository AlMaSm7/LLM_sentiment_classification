experiment:
  name: phase2_prompting

dtype: bfloat16

data:
  dir: data/processed/{lang}
  train_en: train_en.jsonl
  train_target: train_{lang}.jsonl

  dev:
    en: dev_en.jsonl
    target: dev_{lang}.jsonl

  test:
    en: test_en.jsonl
    target: test_{lang}.jsonl

models:
  - name: Qwen/Qwen2.5-3B-Instruct
    role: primary

  - name: utter-project/EuroLLM-9B-Instruct
    role: secondary

prompting:
  # name of id property
  id_key: alignment_id

  # one list of five IDs shared by English, German and Swedish
  # run --select-ids to find valid aligned TRAIN IDs
  five_shot_ids:
    [
      "en/2017/6398054/7016299.xml.gz#461",
      "en/1965/59309/6919338.xml.gz#892",
      "en/1990/100404/5649520.xml.gz#1027",
      "en/1990/100404/5649520.xml.gz#975",
      "en/1965/59309/6919338.xml.gz#695",
    ]

  selection:
    k: 5
    seed: 42
    min_words: 5
    max_words: 20
    max_labels: 3
    min_single: 1

generation:
  max_new_tokens: 64
  batch_size: 8
  chat_template_kwargs: {}

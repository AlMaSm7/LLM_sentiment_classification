experiment:
  name: "example"
  seed: 42

model:
  name: "your-model-name"

peft:
  method: "lora"
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: []

training:
  learning_rate: 0.0002
  batch_size: 4
  gradient_accumulation_steps: 1
  epochs: 3
  max_seq_length: 512

generation:
  max_new_tokens: 64
  do_sample: false

output:
  root_dir: "outputs/peft"

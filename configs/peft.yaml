experiment:
  name: "baseline_qlora_qv" # change for wandb run name
  seed: 42

model:
  name: "Qwen/Qwen2.5-3B-Instruct"

use_wandb: true
wandb_project: "peft_emotion_classification"

peft:
  method: "qlora" # change to qlora / lora if needed

  # LoRa params
  rank: 16
  alpha: 32
  dropout: 0.05

  target_modules: ["q_proj", "v_proj"]

training:
  learning_rate: 0.0002
  batch_size: 8
  gradient_accumulation_steps: 8
  epochs: 6
  max_seq_length: 512
  bf16: true

eval:
  batch_size: 32 # evaluation doesn't calculate gradients, so it can use a larger batch size

generation:
  batch_size: 8
  max_new_tokens: 64

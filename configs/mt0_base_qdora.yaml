experiment:
  name: "mt0_base_qdora_r64"   # new name, so it does not overwrite the mt0_base_v2 runs
  seed: 42

model:
  name: "bigscience/mt0-base"

quantization:
  load_in_4bit: true           # the "Q" in QDoRA: base weights frozen in 4-bit
  quant_type: "nf4"            # NormalFloat4, the QLoRA default
  double_quant: true           # also quantizes the quantization constants (saves a bit more memory)
  compute_dtype: "bfloat16"    # use "float32" on GPUs without bf16 (e.g. T4); never float16 with mT5/mT0

peft:
  method: "dora"
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules: ["q", "k", "v", "o", "wi_0", "wi_1", "wo"]
  use_dora: true
  #q, k, v, o = the four matrices inside attention (query, key, value, output)
  #wi_0, wi_1, wo = the three matrices inside the feed-forward network (FFN)

training:
  learning_rate: 0.0003
  batch_size: 16
  gradient_accumulation_steps: 1
  epochs: 10
  max_seq_length: 256
  warmup_ratio: 0.06
  label_smoothing_factor: 0.1
  gradient_checkpointing: true

generation:
  max_new_tokens: 64
  do_sample: false
  num_beams: 4

output:
  root_dir: "outputs/peft"
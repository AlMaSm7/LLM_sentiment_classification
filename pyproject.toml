[project]
name = "llm-project"
version = "0.1.0"
description = "Cross-Lingual Emotion Classification and Detection Using Large Language Models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "iterative-stratification>=0.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opustools>=1.9.0",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "protobuf>=7.36.2",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.2",
    "torch==2.8.0",
    "transformers>=4.45,<5",
    "trl>=1.15.0",
    "wandb>=0.30.0",
]

[project.scripts]
llm-project = "llm_project:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

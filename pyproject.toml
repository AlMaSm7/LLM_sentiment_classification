[project]
name = "llm-project"
version = "0.1.0"
description = "Cross-Lingual Emotion Classification and Detection Using Large Language Models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "iterative-stratification>=0.1.9",
    "numpy>=2.5.3",
    "opustools>=1.9.0",
    "pandas>=3.0.5",
    "peft>=0.21.0",
    "polars>=1.44.2",
    "pyyaml>=6.0.3",
    "transformers>=5.17.0",
    "wandb>=0.30.0",
]

[project.scripts]
llm-project = "llm_project:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
